<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer Room Starter</title>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* ====== JOIN SCREEN STYLES ====== */
        #joinScreen {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            max-width: 400px;
        }
        #joinScreen h2 {
            margin: 0 0 20px 0;
            color: #333;
        }
        #joinScreen input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        #joinScreen input:focus {
            outline: none;
            border-color: #2196F3;
        }
        #joinBtn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #joinBtn:hover {
            background: #0b7dda;
        }
        #errorMessage {
            color: #f44336;
            margin-top: 10px;
            display: none;
        }

        /* ====== GAME SCREEN STYLES ====== */
        #gameContainer {
            display: none;
            width: 100%;
            max-width: 1000px;
        }
        #roomInfo {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #roomInfo h2 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .player-name {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 5px;
            font-size: 14px;
        }
        #mainContent {
            display: flex;
            gap: 15px;
        }
        #canvasContainer {
            flex: 1;
        }
        canvas {
            border: 3px solid #333;
            box-shadow: 0 6px 30px rgba(0,0,0,0.6);
            display: block;
        }
        #chatContainer {
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }
        #chatContainer h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        #messageList {
            flex: 1;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            min-height: 400px;
            max-height: 400px;
        }
        .message {
            margin-bottom: 8px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 5px;
            word-wrap: break-word;
        }
        .message-username {
            font-weight: bold;
            color: #2196F3;
            margin-right: 5px;
        }
        #messageInput {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        #messageInput:focus {
            outline: none;
            border-color: #2196F3;
        }
        #sendBtn {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #sendBtn:hover {
            background: #45a049;
        }
        .info-text {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- ====== JOIN SCREEN ====== -->
    <div id="joinScreen">
        <h2>🎮 Multiplayer Room Starter</h2>
        <p>Enter your details to join a room (max 3 players per room)</p>
        <input type="text" id="usernameInput" placeholder="Your name" maxlength="20" required>
        <input type="text" id="roomInput" placeholder="Room name" maxlength="20" required>
        <button id="joinBtn">Join Room</button>
        <div id="errorMessage"></div>
    </div>

    <!-- ====== GAME SCREEN ====== -->
    <div id="gameContainer">
        <div id="roomInfo">
            <h2>🎮 Multiplayer Room Starter</h2>
            <div id="roomDetails"></div>
        </div>

        <div id="mainContent">
            <div id="canvasContainer">
                <!-- p5.js canvas will be created here -->
            </div>

            <div id="chatContainer">
                <h3>💬 Room Chat</h3>
                <div id="messageList"></div>
                <input type="text" id="messageInput" placeholder="Type a message..." maxlength="200">
                <button id="sendBtn">Send Message</button>
                <div class="info-text">Messages are only visible to players in this room</div>
            </div>
        </div>
    </div>

    <!-- Load p5.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>

    <!-- Load Socket.IO client from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.3/socket.io.js"></script>

    <!-- Main client code -->
    <script>
        // ====================================================================
        // SOCKET.IO CONNECTION
        // ====================================================================
        // Unlike the "echo server", we now have a custom server that
        // manages rooms and decides what to broadcast to whom
        var socket = io();

        // ====================================================================
        // CLIENT STATE
        // ====================================================================
        let username = '';
        let roomName = '';
        let inRoom = false;
        let players = []; // List of player usernames in this room

        // ====================================================================
        // 🎓 STUDENT INSTRUCTIONS: GAME STATE
        // ====================================================================
        // Add your game state variables here! Examples:
        //
        // let playerPositions = {};  // Store each player's x,y position
        // let gameObjects = [];      // Store game objects (coins, enemies, etc.)
        // let scores = {};           // Track scores for each player
        // let gameStarted = false;   // Whether the game has started
        //
        // ====================================================================

        // ====================================================================
        // JOIN ROOM LOGIC
        // ====================================================================

        // Handle join button click
        document.getElementById('joinBtn').addEventListener('click', () => {
            username = document.getElementById('usernameInput').value.trim();
            roomName = document.getElementById('roomInput').value.trim();

            if (!username || !roomName) {
                showError('Please enter both name and room name!');
                return;
            }

            // Send join request to server
            socket.emit('joinRoom', { username, room: roomName });
        });

        // Handle Enter key in input fields
        document.getElementById('usernameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('joinBtn').click();
        });
        document.getElementById('roomInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('joinBtn').click();
        });

        // Server rejected join (room is full)
        socket.on('roomFull', (data) => {
            showError(data.message);
        });

        // Server accepted join
        socket.on('joinSuccess', (data) => {
            if (!inRoom) {
                inRoom = true;
                document.getElementById('joinScreen').style.display = 'none';
                document.getElementById('gameContainer').style.display = 'block';
                console.log(`Successfully joined room: ${data.room}`);
            }
        });

        // Update room info (player list)
        socket.on('roomInfo', (data) => {
            players = data.players;

            // Update the room details display
            const roomDetailsDiv = document.getElementById('roomDetails');
            const playersList = data.players.map(p => `<span class="player-name">${p}</span>`).join(' ');
            roomDetailsDiv.innerHTML = `
                <strong>Room:</strong> ${data.room} |
                <strong>Players:</strong> ${data.playerCount}/${data.maxPlayers}<br>
                ${playersList}
            `;
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // ====================================================================
        // CHAT/MESSAGING SYSTEM
        // ====================================================================

        // Send message button
        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (message) {
                socket.emit('sendMessage', { message });
                input.value = ''; // Clear input
            }
        });

        // Send message with Enter key
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('sendBtn').click();
            }
        });

        // Receive new message from server
        socket.on('newMessage', (data) => {
            const messageList = document.getElementById('messageList');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <span class="message-username">${data.username}:</span>
                <span>${data.message}</span>
            `;
            messageList.appendChild(messageDiv);

            // Auto-scroll to bottom
            messageList.scrollTop = messageList.scrollHeight;
        });

        // ====================================================================
        // 🎓 STUDENT INSTRUCTIONS: ADDING SOCKET EVENTS
        // ====================================================================
        //
        // To communicate with the server, use this pattern:
        //
        // SEND to server:
        //   socket.emit('eventName', { data: value });
        //
        // RECEIVE from server:
        //   socket.on('eventName', (data) => {
        //       // Handle the data
        //   });
        //
        // Example - sending player position:
        //   socket.emit('updatePosition', { x: mouseX, y: mouseY });
        //
        // Example - receiving game state:
        //   socket.on('gameState', (state) => {
        //       playerPositions = state.positions;
        //       gameObjects = state.objects;
        //   });
        //
        // Remember: The server decides what gets sent to other players!
        // ====================================================================

        // ====================================================================
        // P5.JS SETUP AND DRAW
        // ====================================================================

        function setup() {
            // Create a canvas and attach it to the canvasContainer
            let canvas = createCanvas(600, 500);
            canvas.parent('canvasContainer');

            // ================================================================
            // 🎓 STUDENT INSTRUCTIONS: SETUP
            // ================================================================
            // Initialize your game here!
            // - Load images/assets
            // - Set up initial game state
            // - Configure p5.js settings (frameRate, colorMode, etc.)
            // ================================================================
        }

        function draw() {
            // Simple background
            background(30, 35, 50);

            // Display player names on the canvas
            fill(255);
            textAlign(LEFT, TOP);
            textSize(16);
            text('Players in room:', 20, 20);

            let yPos = 45;
            players.forEach((playerName, index) => {
                fill(100, 200, 100);
                text(`• ${playerName}`, 30, yPos);
                yPos += 25;
            });

            // Simple instruction text
            fill(150);
            textAlign(CENTER, CENTER);
            textSize(14);
            text('This is your p5.js canvas!', width / 2, height / 2);
            text('Add your game rendering code in the draw() function', width / 2, height / 2 + 25);

            // ================================================================
            // 🎓 STUDENT INSTRUCTIONS: DRAW LOOP
            // ================================================================
            // Add your game rendering here!
            //
            // This function runs 60 times per second (60 FPS)
            //
            // Examples:
            // - Draw player sprites at their positions
            // - Draw game objects (coins, enemies, etc.)
            // - Draw score/health displays
            // - Draw game boundaries
            //
            // You can access mouse position with: mouseX, mouseY
            // You can check key presses with: keyIsDown(key_code)
            // ================================================================
        }

        // ====================================================================
        // 🎓 STUDENT INSTRUCTIONS: P5.JS INTERACTION
        // ====================================================================
        // Add your interaction handlers here!
        //
        // Common p5.js functions:
        //
        // function mousePressed() {
        //     // Called once when mouse is clicked
        //     // Example: Shoot a projectile, select an object, etc.
        // }
        //
        // function keyPressed() {
        //     // Called once when a key is pressed
        //     // Example: Start game, open menu, etc.
        // }
        //
        // Continuous input (check every frame in draw()):
        //   if (keyIsDown(LEFT_ARROW)) { /* move left */ }
        //   if (keyIsDown(RIGHT_ARROW)) { /* move right */ }
        //   if (keyIsDown(32)) { /* spacebar - jump */ }
        //
        // ====================================================================

        // Example: Mouse click handler
        function mousePressed() {
            // Only detect clicks inside the canvas
            if (mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height) {
                console.log(`Clicked at: (${mouseX}, ${mouseY})`);

                // ============================================================
                // 🎓 STUDENT INSTRUCTIONS: HANDLE CLICKS
                // ============================================================
                // Add your click handling here!
                //
                // Example - send click to server:
                //   socket.emit('playerClick', { x: mouseX, y: mouseY });
                //
                // Example - spawn a local object:
                //   gameObjects.push({ x: mouseX, y: mouseY, type: 'coin' });
                // ============================================================
            }
        }

        // ====================================================================
        // 🎓 STUDENT INSTRUCTIONS: HELPFUL TIPS
        // ====================================================================
        //
        // CLIENT vs SERVER:
        // - Client (this file): Handles rendering and user input
        // - Server (server.js): Handles game logic and broadcasts updates
        //
        // ROOM ISOLATION:
        // - Players in different rooms never see each other's data
        // - The server uses io.to(room).emit() to send only to your room
        //
        // COMMON PATTERNS:
        //
        // 1. PLAYER MOVEMENT (client predicts, server validates)
        //    Client: Move player immediately, send position to server
        //    Server: Validate position, broadcast to all in room
        //
        // 2. GAME OBJECTS (server is source of truth)
        //    Client: Request to create object
        //    Server: Create object with unique ID, broadcast to all
        //    Client: Render object when received
        //
        // 3. TURN-BASED GAMES
        //    Server: Track whose turn it is
        //    Client: Only allow actions when it's your turn
        //    Server: Validate actions and update game state
        //
        // DEBUGGING:
        // - Open browser console (F12) to see console.log() messages
        // - Check server.js terminal to see server-side console.log()
        // - Use console.log() frequently to understand data flow
        //
        // ====================================================================
    </script>
</body>
</html>
